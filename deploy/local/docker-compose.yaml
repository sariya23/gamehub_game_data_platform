name: gamehub_game_data_platform

x-minio-common: &minio-common
  image: quay.io/minio/aistor/minio:latest
  environment:
    DATA_LAKE_ADMIN_PORT: ${S3__ADMIN_PORT}
    DATA_LAKE_API_PORT: ${S3__API_PORT}
    MINIO_ROOT_USER: ${S3__ROOT_USER}
    MINIO_ROOT_PASSWORD: ${S3__ROOT_PASSWORD}
  command: server --console-address ":9001" minio1/data1 --license minio.license
  ports:
    - "${S3__ADMIN_PORT}:${S3__ADMIN_PORT}"
    - "${S3__API_PORT}:${S3__API_PORT}"
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 5s
    timeout: 5s
    retries: 5
  networks:
    - intranet

services:
  minio1:
    <<: *minio-common
    hostname: minio1
    volumes:
      - data1:/data1
      - ./minio.license:/minio.license:ro
  game_db:
    image: postgres:16
    restart: "always"
    environment:
      POSTGRES_DB: ${DATABASE__NAME}
      POSTGRES_USER: ${DATABASE__USER}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
    ports:
      - "${DATABASE__PORT}:${DATABASE__PORT}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE__USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intranet

volumes:
  data1:

networks:
  intranet:
    external: true
